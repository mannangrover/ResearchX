# Render Blueprint. Render asks for the sync: false values when the service is first created.
# Never add DEMO_PASSWORD or SUPABASE_SECRET_KEY here: see "Host it" in the README.
services:
  - type: web
    name: researchx
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-flash-lite-latest
